model_type: "cfg_model"

# Model path - should be set in specific config files
model_path: "/path/to/model/openpi"

precision: null # for OpenPI-backed CFG, precision is null, please do not change this value

# Action and chunk settings
num_action_chunks: 10
action_dim: 7

# LoRA settings
is_lora: False
lora_rank: 32

# Training settings
use_proprio: True
num_steps: 5
add_value_head: False

# openpi specific parameters
openpi:
  config_name: "pi05_libero"
  num_images_in_input: 2
  noise_level: 0.5
  action_chunk: ${actor.model.num_action_chunks}
  num_steps: ${actor.model.num_steps}
  train_expert_only: True
  action_env_dim: ${actor.model.action_dim}
  noise_method: "flow_sde"
  add_value_head: ${actor.model.add_value_head}
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: null
  # pi0.5 subtask prediction: the VLM predicts the per-frame subtask text and
  # the action expert is conditioned on it. Needs meta/subtasks.jsonl and a
  # subtask_index column; the classification head is not implemented.
  train_subtask_prediction: False
  sample_subtask_prediction: False
  subtask_loss_weight: 1.0
  max_subtask_len: 20
  subtask_temperature: 0.0
  subtask_refresh_steps: 50
