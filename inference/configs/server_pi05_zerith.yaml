# Server config of the remote inference server (inference/server/main.py).
#
# Every value here is static: the two placeholder paths below are the only
# things to edit. See scripts/run_inference_server.sh for how a JAX checkpoint
# is converted into the torch layout this file points at.
model_type: openpi
precision: null
pi05: true
is_lora: false

# The service moves the model to the device itself, after the checkpoint load.
load_to_device: false
action_dim: 23
num_action_chunks: 50
num_steps: 10

# A torch checkpoint: either an RLinf SFT run (full_weights.pt) or a converted
# OpenPI layout (model.safetensors + config.json + <asset_id>/norm_stats.json).
model_path: /home/jszn/hewu/alg-product/RLinf/logs/cfg_rl/cfg_rl_openpi-20261110-19:07:16/deploy/global_step_30000_openpi

openpi:
  task: eval
  config_name: pi05_zerith
  model_action_dim: 32
  action_horizon: 50
  action_chunk: 50
  action_env_dim: 23
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  max_token_len: 200
  torch_compile: true
  # RTC guidance: a replan request is sampled against the unexecuted tail of the
  # previous chunk (paper Algorithm 1). The client refuses to run in RTC mode if
  # this is false.
  rtc_enabled: true
  # "exact" is the PiGDM correction (I - t dv/dx)^T err of the paper, one backward
  # pass per denoise step; the RTC loop then runs eagerly because a captured CUDA
  # graph cannot replay autograd. "approx" corrects with err itself: no backward
  # pass, keeps the graph.
  rtc_guidance_mode: exact
  # Leading denoise steps that take the exact correction, the rest fall back to
  # "approx"; null uses the selected mode for every step.
  rtc_guidance_steps: null
  # Upper clamp of the guidance weight (paper beta).
  rtc_guidance_clip: 5.0
  # Classifier-free guidance: every denoise step mixes the plain-prompt branch
  # with an advantage-conditioned one, (1 - β)·v_plain + β·v_advantage, where the
  # conditioned prompt appends "\nAdvantage: <guidance_type>" as in training.
  # 0.0 samples the plain prompt, 1.0 the conditioned branch alone; any other
  # value keeps both branches in the denoise loop, and 1.5 extrapolates past the
  # conditioned branch with a -0.5 weight on the plain one. --cfg-beta overrides
  # it. Per-denoise-step guidance norms are logged at RLINF_LOG_LEVEL=DEBUG.
  cfgrl_guidance_scale: 1.5
  guidance_type: positive
  # Serve the RTC denoise loop from a captured CUDA graph: one replay per
  # chunk instead of thousands of kernel launches, with the eager numbers kept
  # bit for bit. The graph is captured at the shapes the config pins, so
  # changing max_token_len, num_action_chunks or the camera resolution
  # re-captures it. --no-graph-sampler serves the loop eagerly.
  graph_sampler: true
  # Attention kernel for the Gemma layers. "sdpa" serves the full-sequence
  # (prefix) pass from the fused mem-efficient kernel instead of the eager
  # fp32-logits math: 2.6x faster per prefix layer on an A100. Measured end to
  # end that is only 1.8% of a request (attention is a small share of the
  # 170ms denoise), and it moves the sampled chunk by up to 1.4e-1 on a
  # synthetic observation, so this deployment keeps "eager". The incremental
  # (suffix) steps stay on the eager path either way.
  attn_backend: eager

openpi_data:
  norm_stats_path: /home/jszn/hewu/alg-product/RLinf/logs/cfg_rl/cfg_rl_openpi-20261110-19:07:16/deploy/global_step_30000_openpi/zerith/norm_stats.json

server:
  host: 0.0.0.0
  port: 55555
  # Unset the prompt on the client to fall back to this one.
  default_prompt: "Sort all objects into the correct bins using both arms"
  # Wire camera names per trained view; they must match the client's --camera_names.
  camera_layout:
    base: cam_high
    left_wrist: cam_left_wrist
    right_wrist: cam_right_wrist
  warmup: true
