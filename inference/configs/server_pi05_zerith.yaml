# Server config of the remote inference server (inference/server/main.py).
#
# Every value here is static: the two placeholder paths below are the only
# things to edit. See scripts/run_inference_server.sh for how a JAX checkpoint
# is converted into the torch layout this file points at.
model_type: openpi
precision: null
pi05: true
is_lora: false

# The service moves the model to the device itself, after the checkpoint load.
load_to_device: false
action_dim: 23
num_action_chunks: 50
num_steps: 10

# A torch checkpoint: either an RLinf SFT run (full_weights.pt) or a converted
# OpenPI layout (model.safetensors + config.json + <asset_id>/norm_stats.json).
model_path: logs/cfg_rl/cfg_rl_openpi-20261116-18:47:43/deploy/global_step_9000_openpi

openpi:
  task: eval
  config_name: pi05_zerith
  model_action_dim: 32
  action_horizon: 50
  action_chunk: 50
  action_env_dim: 23
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  max_token_len: 200
  torch_compile: true
  # RTC guidance: a replan request is sampled against the unexecuted tail of the
  # previous chunk (paper Algorithm 1). The client refuses to run in RTC mode if
  # this is false.
  rtc_enabled: true
  # "exact" is the PiGDM correction (I - t dv/dx)^T err of the paper, one backward
  # pass per denoise step. Those backward kernels are captured and replayed with
  # the rest of the loop (measured bit-identical on this checkpoint), so the
  # graph is kept; the remaining cost is the backward arithmetic itself, about
  # +130 ms of a 475 ms request versus "approx". "approx" corrects with err
  # itself and skips the backward.
  rtc_guidance_mode: exact
  # Leading denoise steps that take the exact correction, the rest fall back to
  # "approx"; null uses the selected mode for every step. Under "exact" the
  # Jacobian matters most near t=1, so 3 keeps the strong end of the correction
  # and drops 7 of the 10 backward passes (~-90 ms per request).
  rtc_guidance_steps: 3
  # Upper clamp of the guidance weight (paper beta). It does not mean the same
  # thing in both modes: with a leftover displaced by one normalized unit,
  # "approx" moves the arm dims by ~0.83 rad, "exact" by ~0.15 rad (this
  # checkpoint), because the identity Jacobian skips a factor of ~5-7. "approx"
  # with clip=5 therefore overshoots the overlap target and shows up as a jolt
  # at every replan on the real robot; lower the clip or use "exact".
  rtc_guidance_clip: 5.0
  # pi0.5 subtask stage: the VLM decides the current subtask and the action
  # branch is conditioned on it. Requires a checkpoint trained with
  # train_subtask_prediction. Two stages are available and the choice is
  # orthogonal to the training loss:
  #   classifier - one extra prefix forward plus the classification head, no
  #                per-token decode. Needs subtask_classification training.
  #   generate   - autoregressive text decoding from the prefix slots.
  #   off        - skip the stage and sample from the plain prompt.
  # "auto" prefers the classifier and falls back to generation.
  subtask_mode: classifier
  subtask_classification: true
  # Number of subtask classes; must match the rows of the class table below.
  num_subtask_classes: 13
  subtask_class_hidden_dim: 512
  # Class id -> text table used to turn a predicted class back into the prompt
  # text. Point at the jsonl file, its directory, or the dataset root.
  subtask_classes_path: /data/4T-2/dataset/hewu2008/part_sorting_20261027_subtask/meta/subtasks.jsonl
  sample_subtask_prediction: true
  subtask_temperature: 0.0
  max_subtask_len: 24
  # Sticky class for the classifier stage: one request reads one frame, so a
  # single misread would switch the action condition of that chunk. A switch
  # needs `subtask_switch_patience` consecutive requests whose top-1
  # probability clears `subtask_conf_threshold`; `subtask_force_switch` bounds
  # how long a transition below the threshold is held back. At the RTC request
  # rate (~2/s) patience 3 is about 1.5 s and force 6 about 3 s, which stays
  # well inside the shortest common stage (dataset p10 is 7.2 s) so a real
  # transition still lands in its own stage. Set 0/1/0 for the plain argmax.
  subtask_conf_threshold: 0.90
  subtask_switch_patience: 3
  subtask_force_switch: 6
  # Replay each decode step from a captured CUDA graph (falls back to eager
  # without CUDA). Measured 15 ms -> 6 ms per token on the 2B model; ignored by
  # the classifier stage, which never decodes.
  subtask_decode_graph: true
  # Classifier-free guidance: every denoise step mixes the plain-prompt branch
  # with an advantage-conditioned one, (1 - β)·v_plain + β·v_advantage, where the
  # conditioned prompt appends "\nAdvantage: <guidance_type>" as in training.
  # 0.0 samples the plain prompt, 1.0 the conditioned branch alone; any other
  # value keeps both branches in the denoise loop, and 1.5 extrapolates past the
  # conditioned branch with a -0.5 weight on the plain one. --cfg-beta overrides
  # it. Per-denoise-step guidance norms are logged at RLINF_LOG_LEVEL=DEBUG.
  cfgrl_guidance_scale: 1.0
  guidance_type: positive
  # Serve the RTC denoise loop from a captured CUDA graph: one replay per
  # chunk instead of thousands of kernel launches, with the eager numbers kept
  # bit for bit. The graph is captured at the shapes the config pins, so
  # changing max_token_len, num_action_chunks or the camera resolution
  # re-captures it. --no-graph-sampler serves the loop eagerly.
  graph_sampler: true
  # Attention kernel for the Gemma layers. "sdpa" serves the full-sequence
  # (prefix) pass from the fused mem-efficient kernel instead of the eager
  # fp32-logits math: 2.6x faster per prefix layer on an A100. Measured end to
  # end that is only 1.8% of a request (attention is a small share of the
  # 170ms denoise), and it moves the sampled chunk by up to 1.4e-1 on a
  # synthetic observation, so this deployment keeps "eager". The incremental
  # (suffix) steps stay on the eager path either way.
  attn_backend: eager

openpi_data:
  norm_stats_path: logs/cfg_rl/cfg_rl_openpi-20261116-18:47:43/deploy/global_step_9000_openpi/zerith/norm_stats.json

server:
  host: 0.0.0.0
  port: 55555
  # Unset the prompt on the client to fall back to this one.
  default_prompt: "Sort all objects into the correct bins using both arms"
  # Wire camera names per trained view; they must match the client's --camera_names.
  camera_layout:
    base: cam_high
    left_wrist: cam_left_wrist
    right_wrist: cam_right_wrist
  warmup: true
